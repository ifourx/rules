#### clash通用订阅规则 ####
proxy-groups:
  - name: PROXY
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - Auto Select
      # - 香港节点
      # - 台湾节点
      # - 狮城节点
      # - 日本节点
      - US
      # - 韩国节点
      - Manual Switch
      - DIRECT
  - name: Manual Switch
    icon: https://testingcf.jsdelivr.net/gh/shindgewongxj/WHATSINStash@master/icon/select.png
    include-all: true
    type: select
  - name: Auto Select
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    type: url-test
    include-all: true
    interval: 300
    tolerance: 50

  - name: US
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
    type: url-test
    interval: 300
    tolerance: 50
  - name: 其它地区
    icon: "https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/mini/Available.png"
    include-all: true
    type: select
    filter: "(?i)^(?!.*(?:🇭🇰|🇯🇵|🇺🇸|🇸🇬|🇨🇳|港|hk|hongkong|台|tw|taiwan|日|jp|japan|新|sg|singapore|美|us|unitedstates|直连)).*"

rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: text }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: text }
  classical: &classical { type: http, interval: 86400, behavior: classical, format: text }

rule-providers:
  MyProxy:
    <<: *classical
    url: https://testingcf.jsdelivr.net/gh/ifourx/rules@main/Proxy.list
    path: ./ruleset/MyProxy.list
  MyDirect:
    <<: *classical
    url: https://testingcf.jsdelivr.net/gh/ifourx/rules@main/Direct.list
    path: ./ruleset/MyDirect.list

# ####################
# 使用mihomo内置数据库: https://github.com/MetaCubeX/meta-rules-dat
# clash party客户端外部资源中设置GEOIP数据库为非lite
rules:
  # 1. 局域网与保留地址直接放行（加 no-resolve 防止触发无意义的本地 DNS 解析）
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # 2. 广告拦截
  - GEOSITE,category-ads-all,REJECT

  # 自定义域名代理
  - RULE-SET,MyDirect,DIRECT
  - RULE-SET,MyProxy,PROXY

  # 3. 常见跨国大厂的中国大陆专属/直连服务（防止被误判为海外流量而绕路代理）
  # 即使开着代理, 但是用的是国内的DNS(doh), 所以steam分配过来的下载分片也是国内CDN节点, 所以使用steam@cn分流
  - GEOSITE,steam@cn,DIRECT
  - GEOSITE,steam,PROXY

  # 4.1 核心国内域名直连
  - GEOSITE,cn,DIRECT

  # 4.2 国内 IP 兜底直连（拦截纯 IP 连接、P2P、微信音视频以及规则集漏掉的冷门国内新域名）
  # 注意：这里不加 no-resolve，就是为了让前面漏掉的冷门域名在这里解析出 IP，确认是国内 IP 后救回来
  - GEOIP,CN,DIRECT

  # 5. 最终兜底：以上全没命中的，一律走代理
  - MATCH,PROXY
